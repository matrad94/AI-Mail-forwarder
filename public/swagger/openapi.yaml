openapi: 3.0.0
info:
  title: Email Router API
  version: 1.0.0
  description: API for classifying and dispatching incoming email messages. In the local development environment, sent messages are captured by MailHog at http://localhost:8025.
paths:
  /api/v1/dispatch:
    post:
      summary: Classify and dispatch an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - message
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the original sender.
                message:
                  type: string
                  description: Message content to classify and route.
                subject:
                  type: string
                  nullable: true
                  description: Optional email subject. If omitted, null, or empty, the agent generates a concise subject from the message.
      responses:
        '200':
          description: Email routed and dispatch status returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Summary of the dispatch status.
        '400':
          description: Request data is missing or invalid, the subject is not a string or null, or the enabled security guard rejected the message as a prompt-injection attempt.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    description: Explanation of the request validation error.
