services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434/api}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      ENABLE_SECURITY_GUARD: ${ENABLE_SECURITY_GUARD:-true}
      ENABLE_URGENCY_CHECK: ${ENABLE_URGENCY_CHECK:-true}
    volumes:
      - ./config/rules.txt:/var/www/html/config/rules.txt:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

volumes:
  ollama_data:

networks:
  app-network:
    driver: bridge
